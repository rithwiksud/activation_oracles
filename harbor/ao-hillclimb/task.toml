schema_version = "1.3"

# The submitted repo, minus anything train.sh must regenerate (caches, checkpoints, weights)
artifacts = [
  { source = "/app/repo", exclude = [
    "sft_training_data", "checkpoints*", "oracle_out", "wandb", "sft_outputs", "__pycache__",
    "*.pt", "*.safetensors", "*.bin", "*.npy",
  ] },
]

[task]
name = "local/ao-personaqa-hillclimb"
description = "Improve activation oracle training for Qwen3.5-0.8B on PersonaQA; scored on a held-out task."

[metadata]
category = "ml-research"

[environment]
docker_image = "ao-agent:latest"
gpus = 1
# Training runs log to wandb (astro-imagen/activation_oracles); values come from the host env (--env-file)
env = { WANDB_MODE = "online", WANDB_API_KEY = "${WANDB_API_KEY}", WANDB_ENTITY = "${WANDB_ENTITY}", WANDB_TAGS = "harbor-agent" }

# The only way to score an oracle on the dev/validation tasks (capped; see environment/docker-compose.yaml). The
# eval sidecar shares the egress sidecar's network namespace with the agent, hence localhost.
[[environment.mcp_servers]]
name = "ao-eval"
transport = "streamable-http"
url = "http://localhost:8000/mcp"

[agent]
timeout_sec = 9000
# Only the Claude API and wandb (plus the eval sidecar on localhost); models and data are preloaded and the HF hub is
# unreachable
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.wandb.ai"]

[verifier]
timeout_sec = 4200
env = { WANDB_MODE = "online", WANDB_API_KEY = "${WANDB_API_KEY}", WANDB_ENTITY = "${WANDB_ENTITY}", WANDB_TAGS = "harbor-verifier" }

[verifier.environment]
docker_image = "ao-verifier:latest"
gpus = 1
# wandb only. The held-out assets stay unreadable to the user that runs the submission.
network_mode = "allowlist"
allowed_hosts = ["api.wandb.ai"]
